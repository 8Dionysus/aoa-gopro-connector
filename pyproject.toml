[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-gopro-connector"
version = "0.1.0.dev0"
description = "Governed GoPro camera connector for AoA and standalone use."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "8Dionysus" }]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
opengopro = ["open-gopro==0.22.0; python_version < '3.14'"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.15"]

[project.scripts]
aoa-gopro = "aoa_gopro_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/aoa-gopro-connector/schemas" = ["connector/schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/validate_connector.py" = ["E402"]
