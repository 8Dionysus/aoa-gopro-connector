schema: aoa_gopro_read_route_allowlist_v1
posture: read_only
routes:
  - id: camera_info
    method: GET
    path: /gopro/camera/info
    purpose: allowlisted model and firmware capability facts
  - id: camera_state
    method: GET
    path: /gopro/camera/state
    purpose: observed status and setting-key inventory
  - id: media_list
    method: GET
    path: /gopro/media/list
    purpose: media group and item counts without filenames
effect_routes: []
redirects: denied
raw_retention: denied
